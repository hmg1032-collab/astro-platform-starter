<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Mid-tier coffee blend in a premium matte black stand-up packet with Abimanyu 3 branding and caramel/chocolate accents, with a subtle window showing coffee inside">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f3ee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#0b1220" flood-opacity="0.20"/>
    </filter>
    <filter id="matte" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0.9 0 0 0 0
        0 0.9 0 0 0
        0 0 0.9 0 0
        0 0 0 0.18 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <linearGradient id="packetBody" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.55" stop-color="#151a22"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="packetEdge" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#273244" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0b0f17" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#2a140a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.55" stop-color="#b45309"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <clipPath id="logoClip">
      <rect x="510" y="255" width="180" height="80" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <rect x="0" y="578" width="1200" height="222" fill="#ffffff"/>
  <rect x="0" y="578" width="1200" height="2" fill="#efe7dd"/>

  <g filter="url(#shadow)" transform="translate(600 420) rotate(-2) translate(-600 -420)">
    <ellipse cx="600" cy="678" rx="210" ry="34" fill="#0b1220" opacity="0.10"/>

    <path
      d="M430 170
         C435 150 452 140 476 140
         H724
         C748 140 765 150 770 170
         L808 640
         C812 680 794 704 758 712
         H442
         C406 704 388 680 392 640
         L430 170Z"
      fill="url(#packetBody)"
      filter="url(#matte)"
    />

    <path d="M458 170 L492 642 C494 666 482 690 458 704 C430 698 416 676 418 650 L446 200 C448 186 452 176 458 170Z" fill="url(#packetEdge)" opacity="0.55"/>
    <path d="M742 170 L708 642 C706 666 718 690 742 704 C770 698 784 676 782 650 L754 200 C752 186 748 176 742 170Z" fill="url(#packetEdge)" opacity="0.45"/>

    <rect x="458" y="158" width="284" height="16" rx="8" fill="#0b0f17" opacity="0.95"/>
    <rect x="470" y="182" width="260" height="8" rx="4" fill="#ffffff" opacity="0.06"/>
    <path d="M470 186 H730" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

    <rect x="470" y="220" width="260" height="420" rx="34" fill="#0b1220" opacity="0.35"/>

    <rect x="492" y="240" width="216" height="168" rx="28" fill="#0b0f17" opacity="0.72"/>
    <rect x="502" y="250" width="196" height="92" rx="18" fill="#ffffff" opacity="0.92"/>
    <g clip-path="url(#logoClip)" opacity="0.98">
      <image href="/images/abimanyu-logo.jpg" x="510" y="255" width="180" height="80" preserveAspectRatio="xMidYMid meet"/>
    </g>
    <text x="600" y="366" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="800" fill="#e2e8f0" letter-spacing="2">ABIMANYU 3</text>
    <text x="600" y="392" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="4">WHOLESALE COFFEE</text>

    <rect x="492" y="416" width="216" height="14" rx="7" fill="url(#accent)" opacity="0.98"/>
    <text x="600" y="452" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="12" font-weight="800" fill="#fff7ed" letter-spacing="4">MID‑TIER BLEND</text>
    <rect x="492" y="464" width="160" height="10" rx="5" fill="#ffffff" opacity="0.08"/>
    <rect x="492" y="482" width="190" height="10" rx="5" fill="#ffffff" opacity="0.06"/>

    <g opacity="0.98">
      <path d="M510 500 H690 C706 500 720 514 720 530 V650 C720 666 706 680 690 680 H510 C494 680 480 666 480 650 V530 C480 514 494 500 510 500Z" fill="#ffffff" opacity="0.08"/>
      <path d="M510 506 H690 C702 506 712 516 712 528 V648 C712 660 702 670 690 670 H510 C498 670 488 660 488 648 V528 C488 516 498 506 510 506Z" fill="url(#coffee)" opacity="0.88"/>
      <path d="M488 560 C532 538 568 540 604 556 C640 572 678 574 712 560 V590 C676 604 638 602 604 586 C568 570 532 568 488 590 V560Z" fill="#000000" opacity="0.10"/>
      <path d="M500 520 L700 650" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10"/>
      <path d="M500 520 L700 650" stroke="#ffffff" stroke-opacity="0.06" stroke-width="22"/>
      <path d="M498 512 H702" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M498 670 H702" stroke="#000000" stroke-opacity="0.10" stroke-width="2"/>
    </g>

    <path d="M520 210 C548 190 594 184 640 190 C672 194 694 204 694 204 V654 C694 654 672 670 642 676 C596 686 548 672 520 654Z" fill="#ffffff" opacity="0.05"/>
  </g>
</svg>
