<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Coffee sample jar with Abimanyu 3 label">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8b3a08"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e7c07f"/>
      <stop offset="1" stop-color="#b8833a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="coffeeGround" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#7c3f18"/>
      <stop offset="1" stop-color="#2a140a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <clipPath id="jarClip">
      <rect x="250" y="150" width="300" height="340" rx="42"/>
    </clipPath>
  </defs>

  <rect width="800" height="560" fill="url(#bg)"/>
  <rect y="418" width="800" height="142" fill="#b86a1a" opacity="0.35"/>

  <g filter="url(#shadow)">
    <ellipse cx="400" cy="500" rx="170" ry="26" fill="#0b1220" opacity="0.25"/>

    <!-- Lid -->
    <rect x="240" y="105" width="320" height="84" rx="40" fill="url(#lid)"/>
    <rect x="240" y="128" width="320" height="18" rx="9" fill="#000000" opacity="0.08"/>
    <rect x="258" y="118" width="284" height="10" rx="5" fill="#ffffff" opacity="0.14"/>

    <!-- Jar glass -->
    <rect x="250" y="150" width="300" height="340" rx="42" fill="#0b1220" opacity="0.10"/>
    <rect x="258" y="158" width="284" height="324" rx="36" fill="url(#glass)"/>
    <rect x="258" y="158" width="284" height="324" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="3"/>

    <!-- Contents -->
    <g clip-path="url(#jarClip)">
      <rect x="250" y="310" width="300" height="180" fill="url(#coffeeGround)" opacity="0.92"/>
      <rect x="250" y="280" width="300" height="40" fill="#000000" opacity="0.08"/>
      <!-- Beans -->
      <g opacity="0.95">
        <g fill="#3a1d10">
          <ellipse cx="310" cy="250" rx="16" ry="12"/>
          <ellipse cx="352" cy="235" rx="15" ry="11"/>
          <ellipse cx="395" cy="252" rx="16" ry="12"/>
          <ellipse cx="438" cy="232" rx="15" ry="11"/>
          <ellipse cx="480" cy="250" rx="16" ry="12"/>
          <ellipse cx="330" cy="270" rx="15" ry="11"/>
          <ellipse cx="372" cy="268" rx="16" ry="12"/>
          <ellipse cx="418" cy="270" rx="15" ry="11"/>
          <ellipse cx="460" cy="270" rx="16" ry="12"/>
        </g>
        <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" filter="url(#soft)">
          <path d="M301 244 C309 248 313 254 318 260"/>
          <path d="M343 231 C351 235 355 241 360 247"/>
          <path d="M386 245 C394 249 398 255 403 261"/>
          <path d="M429 229 C437 233 441 239 446 245"/>
          <path d="M471 244 C479 248 483 254 488 260"/>
        </g>
      </g>
    </g>

    <!-- Twine -->
    <path d="M265 200 C330 232 470 232 535 200" fill="none" stroke="#ffffff" stroke-opacity="0.70" stroke-width="10"/>
    <path d="M265 200 C330 232 470 232 535 200" fill="none" stroke="#b91c1c" stroke-opacity="0.70" stroke-width="6"/>
    <path d="M382 202 C360 220 340 234 318 246" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7"/>
    <path d="M418 202 C440 220 460 234 482 246" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7"/>

    <!-- Label -->
    <rect x="305" y="315" width="190" height="120" rx="18" fill="#f8fafc" opacity="0.92"/>
    <rect x="305" y="315" width="190" height="120" rx="18" fill="none" stroke="#0b1220" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M400 338c-26 0-50 15-50 35 0 20 24 35 50 35s50-15 50-35c0-20-24-35-50-35Zm0 10c18 0 32 10 32 25s-14 25-32 25-32-10-32-25 14-25 32-25Z" fill="#0b1220" opacity="0.85"/>
    <circle cx="400" cy="370" r="7" fill="#0b1220" opacity="0.9"/>
    <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0b1220">ABIMANYU 3</text>
  </g>
</svg>
