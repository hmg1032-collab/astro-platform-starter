<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Vacuum-packed coffee sample bags">
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.55" stop-color="#b45309"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="pack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="752" height="512" rx="40" fill="url(#bg2)"/>
  <path d="M70 440c180-92 398-108 660-48v76H70v-28Z" fill="#0b1220" opacity="0.18"/>

  <g filter="url(#shadow2)">
    <!-- Bag 1 -->
    <g transform="translate(170 110)">
      <path d="M70 0h180l10 40H60L70 0Z" fill="#0f172a"/>
      <path d="M60 40h210v310c0 26-22 48-48 48H108c-26 0-48-22-48-48V40Z" fill="url(#pack)" stroke="#fde68a" stroke-opacity="0.35" stroke-width="3"/>
      <rect x="78" y="62" width="174" height="22" rx="11" fill="url(#seal)" opacity="0.9"/>
      <rect x="92" y="108" width="146" height="152" rx="22" fill="#0b1220" opacity="0.55" stroke="#fbbf24" stroke-opacity="0.35"/>
      <path d="M112 214c26 20 68 20 94 0 8-6 18 5 11 12-32 34-86 34-116 0-7-7 3-18 11-12Z" fill="#f59e0b" opacity="0.75"/>
      <path d="M126 186c14-26 34-38 60-38 26 0 46 12 60 38-20-8-40-12-60-12s-40 4-60 12Z" fill="#dc2626" opacity="0.55"/>
      <text x="165" y="288" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="18" text-anchor="middle" fill="#fde68a" opacity="0.95">VACUUM</text>
      <text x="165" y="312" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="14" text-anchor="middle" fill="#e2e8f0" opacity="0.75">Sample Pack</text>
    </g>

    <!-- Bag 2 -->
    <g transform="translate(420 140)">
      <path d="M70 0h170l10 38H60L70 0Z" fill="#0f172a"/>
      <path d="M60 38h190v286c0 24-20 44-44 44H104c-24 0-44-20-44-44V38Z" fill="url(#pack)" stroke="#fde68a" stroke-opacity="0.35" stroke-width="3"/>
      <rect x="76" y="58" width="158" height="20" rx="10" fill="url(#seal)" opacity="0.9"/>
      <rect x="90" y="102" width="130" height="136" rx="20" fill="#0b1220" opacity="0.55" stroke="#fbbf24" stroke-opacity="0.35"/>
      <path d="M108 196c24 18 60 18 84 0 8-6 18 5 11 12-28 30-78 30-106 0-7-7 3-18 11-12Z" fill="#f59e0b" opacity="0.72"/>
      <text x="155" y="266" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" text-anchor="middle" fill="#fde68a" opacity="0.95">SEAL</text>
      <text x="155" y="290" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="13" text-anchor="middle" fill="#e2e8f0" opacity="0.75">Courier Ready</text>
