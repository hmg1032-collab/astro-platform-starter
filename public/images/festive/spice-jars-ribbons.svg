<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-label="Festive spice jars with gift ribbons">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.55" stop-color="#b45309"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="752" height="512" rx="40" fill="url(#bg)"/>
  <path d="M64 420c110-70 226-92 346-66 86 18 176 12 270-18v132H64V420Z" fill="#0b1220" opacity="0.18"/>
  <g filter="url(#shadow)">
    <!-- Jar 1 -->
    <g transform="translate(150 120)">
      <rect x="40" y="8" width="180" height="60" rx="18" fill="#111827" opacity="0.9"/>
      <rect x="58" y="24" width="144" height="22" rx="11" fill="#f59e0b" opacity="0.85"/>
      <rect x="24" y="64" width="212" height="280" rx="42" fill="url(#glass)" stroke="#fde68a" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M56 120c46-28 98-28 156 0v150c-52 36-104 36-156 0V120Z" fill="#7c2d12" opacity="0.55"/>
      <path d="M62 110h28v214H62z" fill="#ffffff" opacity="0.16"/>

      <!-- Ribbon -->
      <path d="M130 70c18 0 34 8 34 18s-16 18-34 18-34-8-34-18 16-18 34-18Z" fill="url(#ribbon)"/>
      <path d="M130 66c-20 0-38 10-38 22 0 12 18 22 38 22 20 0 38-10 38-22 0-12-18-22-38-22Zm0 10c11 0 20 5 20 12s-9 12-20 12-20-5-20-12 9-12 20-12Z" fill="#fff" opacity="0.25"/>
      <path d="M128 88h4v70h-4z" fill="#fef3c7" opacity="0.95"/>
      <path d="M86 88c-16 8-30 22-38 40 26-10 42-20 54-34-7-2-12-4-16-6Z" fill="#dc2626"/>
      <path d="M174 88c16 8 30 22 38 40-26-10-42-20-54-34 7-2 12-4 16-6Z" fill="#dc2626"/>
    </g>

    <!-- Jar 2 -->
    <g transform="translate(420 140)">
      <rect x="40" y="0" width="170" height="56" rx="18" fill="#0f172a" opacity="0.92"/>
      <rect x="58" y="16" width="134" height="22" rx="11" fill="#fbbf24" opacity="0.85"/>
      <rect x="22" y="56" width="206" height="260" rx="40" fill="url(#glass)" stroke="#fde68a" stroke-opacity="0.55" stroke-width="3"/>
      <path d="M54 112c44-26 94-26 150 0v140c-48 34-98 34-150 0V112Z" fill="#14532d" opacity="0.22"/>
      <path d="M62 92h26v212H62z" fill="#ffffff" opacity="0.16"/>

      <!-- Ribbon -->
      <path d="M124 60c18 0 32 7 32 16s-14 16-32 16-32-7-32-16 14-16 32-16Z" fill="url(#ribbon)"/>
      <path d="M122 80h4v66h-4z" fill="#fef3c7" opacity="0.95"/>
      <path d="M84 78c-18 10-28 24-34 42 24-10 40-20 50-36-6-2-11-4-16-6Z" fill="#b91c1c"/>
      <path d="M164 78c18 10 28 24 34 42-24-10-40-20-50-36 6-2 11-4 16-6Z" fill="#b91c1c"/>
    </g>
