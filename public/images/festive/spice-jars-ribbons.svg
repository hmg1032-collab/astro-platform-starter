  <g opacity="0.22">
    <path d="M90 90c18 0 18 26 0 26s-18-26 0-26Zm620 326c16 0 16 22 0 22s-16-22 0-22Z" fill="#fff"/>
    <path d="M682 112l10 10-10 10-10-10 10-10Zm-560 316l8 8-8 8-8-8 8-8Z" fill="#fde68a"/>
