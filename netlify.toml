[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.0"

[functions]
  directory = "netlify/functions"

# Domain-level redirects: consolidate all traffic to the primary custom domain.
# These are also defined in public/_redirects (which takes priority) as a belt-and-braces approach.
[[redirects]]
  from = "https://www.abimanyu3wholesale.com/*"
  to = "https://abimanyu3wholesale.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://abimanyu3wholesale.netlify.app/*"
  to = "https://abimanyu3wholesale.com/:splat"
  status = 301
  force = true

# Internal path redirects
[[redirects]]
  from = "/delivery"
  to = "/account"
  status = 301
